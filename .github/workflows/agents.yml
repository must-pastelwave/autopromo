# autopromo agents. Runs Claude Code on YOUR Claude subscription (Settings → Secrets → CLAUDE_CODE_OAUTH_TOKEN,
# made with `claude setup-token`). An ANTHROPIC_API_KEY secret works instead if you prefer pay-per-use.
# Times are UTC: 22:00 UTC = 07:00 KST. Change them freely.
#
# "auto" runs every 15 minutes and only starts Claude when a product needs something:
#   new or week-old product → researcher, then planner · owner asked for a plan or a revision → planner
#   plan just confirmed → writer, then reviewer.  Nothing needed → the run ends in seconds, no AI used.
name: agents

on:
  schedule:
    - cron: "*/15 * * * *" # auto:     the journey (research → plan → kickoff), only when needed
    - cron: "0 22 * * *"   # writer:   daily 07:00 KST
    - cron: "0 23 * * *"   # reviewer: daily 08:00 KST
    - cron: "0 11 * * 0"   # analyst:  Sun 20:00 KST
    - cron: "0 0 * * 1"    # scout:    Mon 09:00 KST, finds communities to share posts in
  workflow_dispatch:
    inputs:
      agent:
        description: Which agent to run now (auto = whatever the products need)
        type: choice
        default: auto
        options: [auto, researcher, planner, writer, reviewer, analyst, scout]

permissions:
  contents: read

concurrency:
  group: autopromo-agents   # one agent at a time; the app assumes it
  cancel-in-progress: false

env:
  APP_URL: ${{ secrets.APP_URL }}
  AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Decide what to run
        id: pick
        run: |
          api() { curl -sSf -H "Authorization: Bearer $AGENT_TOKEN" "$APP_URL/api/agent/$1"; }
          case "${{ github.event.schedule }}" in
            "0 22 * * *") jobs="writer" ;;
            "0 23 * * *") jobs="reviewer" ;;
            "0 11 * * 0") jobs="analyst" ;;
            "0 0 * * 1") jobs="scout" ;;
            *) jobs="${{ inputs.agent || 'auto' }}" ;;
          esac
          research=""; plan=""; kickoff=""
          if [ "$jobs" = auto ]; then
            w=$(api work)
            research=$(echo "$w" | jq -r '.research | join(" ")')
            plan=$(echo "$w" | jq -r '.plan | join(" ")')
            kickoff=$(echo "$w" | jq -r '.kickoff | join(" ")')
            jobs=""
            [ -n "$research" ] && jobs="researcher planner"
            [ -n "$plan" ] && [ -z "$research" ] && jobs="planner"
            if [ -n "$kickoff" ] || [ "$(echo "$w" | jq -r .write)" = true ]; then jobs="$jobs writer reviewer"
            elif [ "$(echo "$w" | jq -r .review)" = true ]; then jobs="$jobs reviewer"; fi
          fi
          jobs=$(echo $jobs)
          turns=0
          for j in $jobs; do case $j in researcher|planner) turns=$((turns+40));; scout) turns=$((turns+120));; writer) turns=$((turns+80));; reviewer) turns=$((turns+50));; *) turns=$((turns+20));; esac; done
          echo "Jobs: ${jobs:-none}"
          {
            echo "jobs=$jobs"; echo "turns=$turns"
            echo "research=$research"; echo "plan=$(echo $plan $research)"; echo "kickoff=$kickoff"
          } >> "$GITHUB_OUTPUT"

      - name: Tell the app the run started
        if: steps.pick.outputs.jobs != ''
        run: |
          body=$(jq -nc --arg jobs "${{ steps.pick.outputs.jobs }}" --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson products "[$(echo ${{ steps.pick.outputs.plan }} | tr ' ' ',')]" --argjson plans "[$(echo ${{ steps.pick.outputs.kickoff }} | tr ' ' ',')]" \
            '{gh_run_id: ${{ github.run_id }}, jobs: $jobs, product_ids: $products, plan_ids: $plans, status: "running", url: $url}')
          curl -sS -X POST -H "Authorization: Bearer $AGENT_TOKEN" -H 'content-type: application/json' -d "$body" "$APP_URL/api/agent/runs" > /dev/null || true

      - uses: actions/checkout@v4
        if: steps.pick.outputs.jobs != ''

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.pick.outputs.jobs != ''
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are the autopromo agent. Do these jobs in this order, each one completely: ${{ steps.pick.outputs.jobs }}.
            Read agents/common.md once, then for each job read agents/<job>.md and do that job before starting the next.
            When a job file says to stop, that job is finished: go on to the next job.
          # The turn cap keeps a confused run from running up the bill.
          claude_args: |
            --model ${{ vars.AGENT_MODEL || 'claude-opus-5-5' }}
            --max-turns ${{ steps.pick.outputs.turns }}
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(curl:*)"

      # Record the attempt even if the agent failed, so the 15-minute check waits 3 hours before trying again.
      - name: Record what ran
        if: always() && steps.pick.outputs.jobs != ''
        run: |
          post() { curl -sS -X POST -H "Authorization: Bearer $AGENT_TOKEN" -H 'content-type: application/json' -d "$2" "$APP_URL/api/agent/$1" > /dev/null; }
          for id in ${{ steps.pick.outputs.research }}; do post "products/$id/tried" '{"agent":"researcher"}'; done
          case " ${{ steps.pick.outputs.jobs }} " in *" planner "*) for id in ${{ steps.pick.outputs.plan }}; do post "products/$id/tried" '{"agent":"planner"}'; done ;; esac
          for id in ${{ steps.pick.outputs.kickoff }}; do post "plans/$id/kickoff" '{}'; done
          status=$([ "${{ steps.claude.outcome }}" = success ] && echo done || echo failed)
          body=$(jq -nc --arg jobs "${{ steps.pick.outputs.jobs }}" --arg st "$status" \
            --argjson products "[$(echo ${{ steps.pick.outputs.plan }} | tr ' ' ',')]" --argjson plans "[$(echo ${{ steps.pick.outputs.kickoff }} | tr ' ' ',')]" \
            '{gh_run_id: ${{ github.run_id }}, jobs: $jobs, product_ids: $products, plan_ids: $plans, status: $st}')
          post runs "$body"
