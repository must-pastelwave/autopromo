# autopromo agents. Runs Claude Code on YOUR Claude subscription (Settings → Secrets → CLAUDE_CODE_OAUTH_TOKEN,
# made with `claude setup-token`). An ANTHROPIC_API_KEY secret works instead if you prefer pay-per-use.
# Times are UTC: 22:00 UTC = 07:00 KST. Change them freely.
#
# "auto" runs every 15 minutes and only starts Claude when a product needs something:
#   new or week-old product → researcher, then planner · owner asked for a plan or a revision → planner
#   plan just confirmed → writer, then reviewer.  Nothing needed → the run ends in seconds, no AI used.
name: agents

on:
  schedule:
    - cron: "*/15 * * * *" # auto:     the journey (research → plan → kickoff), only when needed
    - cron: "0 22 * * *"   # writer:   daily 07:00 KST
    - cron: "0 23 * * *"   # reviewer: daily 08:00 KST
    - cron: "0 11 * * 0"   # analyst:  Sun 20:00 KST
    - cron: "0 0 * * 1"    # scout:    Mon 09:00 KST, finds communities to share posts in
  workflow_dispatch:
    inputs:
      agent:
        description: Which agent to run now (auto = whatever the products need)
        type: choice
        default: auto
        options: [auto, researcher, planner, writer, reviewer, analyst, scout]

permissions:
  contents: read

concurrency:
  group: autopromo-agents   # one agent at a time; the app assumes it
  cancel-in-progress: false

env:
  APP_URL: ${{ secrets.APP_URL }}
  AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Decide what to run
        id: pick
        run: |
          api() { curl -sSf -H "Authorization: Bearer $AGENT_TOKEN" "$APP_URL/api/agent/$1"; }
          case "${{ github.event.schedule }}" in
            "0 22 * * *") jobs="writer" ;;
            "0 23 * * *") jobs="reviewer" ;;
            "0 11 * * 0") jobs="analyst" ;;
            "0 0 * * 1") jobs="scout" ;;
            *) jobs="${{ inputs.agent || 'auto' }}" ;;
          esac
          research=""; plan=""; kickoff=""
          if [ "$jobs" = auto ]; then
            w=$(api work)
            research=$(echo "$w" | jq -r '.research | join(" ")')
            plan=$(echo "$w" | jq -r '.plan | join(" ")')
            kickoff=$(echo "$w" | jq -r '.kickoff | join(" ")')
            jobs=""
            [ -n "$research" ] && jobs="researcher planner"
            [ -n "$plan" ] && [ -z "$research" ] && jobs="planner"
            if [ -n "$kickoff" ] || [ "$(echo "$w" | jq -r .write)" = true ]; then jobs="$jobs writer reviewer"
            elif [ "$(echo "$w" | jq -r .review)" = true ]; then jobs="$jobs reviewer"; fi
          fi
          jobs=$(echo $jobs)
          # Video posts waiting for their edit to be rendered (see the last step).
          videos=$(api videos | jq '.posts | length')
          turns=0
          for j in $jobs; do case $j in researcher|planner) turns=$((turns+40));; scout) turns=$((turns+120));; writer) turns=$((turns+80));; reviewer) turns=$((turns+50));; *) turns=$((turns+20));; esac; done
          echo "Jobs: ${jobs:-none}"
          {
            echo "jobs=$jobs"; echo "turns=$turns"; echo "videos=$videos"
            echo "research=$research"; echo "plan=$(echo $plan $research)"; echo "kickoff=$kickoff"
          } >> "$GITHUB_OUTPUT"

      - name: Tell the app the run started
        if: steps.pick.outputs.jobs != ''
        run: |
          body=$(jq -nc --arg jobs "${{ steps.pick.outputs.jobs }}" --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson products "[$(echo ${{ steps.pick.outputs.plan }} | tr ' ' ',')]" --argjson plans "[$(echo ${{ steps.pick.outputs.kickoff }} | tr ' ' ',')]" \
            '{gh_run_id: ${{ github.run_id }}, jobs: $jobs, product_ids: $products, plan_ids: $plans, status: "running", url: $url}')
          curl -sS -X POST -H "Authorization: Bearer $AGENT_TOKEN" -H 'content-type: application/json' -d "$body" "$APP_URL/api/agent/runs" > /dev/null || true

      - uses: actions/checkout@v4
        if: steps.pick.outputs.jobs != '' || steps.pick.outputs.videos != '0'

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.pick.outputs.jobs != ''
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are the autopromo agent. Do these jobs in this order, each one completely: ${{ steps.pick.outputs.jobs }}.
            Read agents/common.md once, then for each job read agents/<job>.md and do that job before starting the next.
            When a job file says to stop, that job is finished: go on to the next job.
          # The turn cap keeps a confused run from running up the bill.
          claude_args: |
            --model ${{ vars.AGENT_MODEL || 'claude-opus-5-5' }}
            --max-turns ${{ steps.pick.outputs.turns }}
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(curl:*)"

      # Record the attempt even if the agent failed, so the 15-minute check waits 3 hours before trying again.
      - name: Record what ran
        if: always() && steps.pick.outputs.jobs != ''
        run: |
          post() { curl -sS -X POST -H "Authorization: Bearer $AGENT_TOKEN" -H 'content-type: application/json' -d "$2" "$APP_URL/api/agent/$1" > /dev/null; }
          for id in ${{ steps.pick.outputs.research }}; do post "products/$id/tried" '{"agent":"researcher"}'; done
          case " ${{ steps.pick.outputs.jobs }} " in *" planner "*) for id in ${{ steps.pick.outputs.plan }}; do post "products/$id/tried" '{"agent":"planner"}'; done ;; esac
          for id in ${{ steps.pick.outputs.kickoff }}; do post "plans/$id/kickoff" '{}'; done
          status=$([ "${{ steps.claude.outcome }}" = success ] && echo done || echo failed)
          body=$(jq -nc --arg jobs "${{ steps.pick.outputs.jobs }}" --arg st "$status" \
            --argjson products "[$(echo ${{ steps.pick.outputs.plan }} | tr ' ' ',')]" --argjson plans "[$(echo ${{ steps.pick.outputs.kickoff }} | tr ' ' ',')]" \
            '{gh_run_id: ${{ github.run_id }}, jobs: $jobs, product_ids: $products, plan_ids: $plans, status: $st}')
          post runs "$body"

      # Videos: each post's beats → a HyperFrames edit (video/build.mjs) → mp4 → Zernio's media store → the post.
      # Runs after the writer, so today's videos are made in the same run; the 15-minute check picks up the rest.
      - uses: actions/setup-node@v4
        if: always() && (steps.pick.outputs.jobs != '' || steps.pick.outputs.videos != '0')
        with:
          node-version: 22
      # The narrator's voice model (Kokoro, ~350 MB), downloaded once and kept between runs.
      - uses: actions/cache@v4
        if: always() && (steps.pick.outputs.jobs != '' || steps.pick.outputs.videos != '0')
        with:
          path: ~/.cache/hyperframes/tts
          key: kokoro-v1
      - name: Render videos
        if: always() && (steps.pick.outputs.jobs != '' || steps.pick.outputs.videos != '0')
        run: |
          api() { curl -sS -H "Authorization: Bearer $AGENT_TOKEN" -H 'content-type: application/json' "$@"; }
          list=$(api "$APP_URL/api/agent/videos" | jq -c '.posts[]')
          [ -z "$list" ] && { echo "No videos to render"; exit 0; }
          sudo apt-get install -y -qq ffmpeg > /dev/null
          npm install -g --silent hyperframes@0.8.225
          hyperframes telemetry disable > /dev/null 2>&1 || true
          # Narration: Kokoro runs on the runner, free, no key (video/build.mjs; Korean stays silent).
          python3 -m venv "$RUNNER_TEMP/kokoro" && "$RUNNER_TEMP/kokoro/bin/pip" install -q kokoro-onnx soundfile \
            && export HYPERFRAMES_TTS=1 HYPERFRAMES_PYTHON="$RUNNER_TEMP/kokoro/bin/python" || echo "No narration this run: Kokoro didn't install"
          echo "$list" | while read -r post; do
            id=$(echo "$post" | jq -r .id); dir="$RUNNER_TEMP/v$id"
            fail() { echo "post $id: $1"; api -X POST -d "$(jq -nc --arg e "$1" '{error: $e}')" "$APP_URL/api/agent/posts/$id/video" > /dev/null; }
            echo "$post" > "$RUNNER_TEMP/p$id.json"
            node video/build.mjs "$RUNNER_TEMP/p$id.json" "$dir" || { fail "build failed"; continue; }
            # Quality gate before rendering: text cut off or off-frame, unreadable contrast, broken timing (HyperFrames' own check).
            (cd "$dir" && hyperframes check --json 2> /dev/null) > "$dir.check.json"
            if [ "$(jq -r .ok "$dir.check.json")" != true ]; then
              fail "quality check: $(jq -r '[.. | objects | select(.severity? == "error") | .message][0] // "failed"' "$dir.check.json" | cut -c1-250)"; continue
            fi
            (cd "$dir" && hyperframes render -o raw.mp4) > "$dir.log" 2>&1 || { fail "render failed: $(tail -c 250 "$dir.log")"; continue; }
            # No narration (e.g. Korean): add a silent sound track, since some apps treat a video without one as broken.
            if ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$dir/raw.mp4" | grep -q .; then mv "$dir/raw.mp4" "$dir/out.mp4"
            else ffmpeg -v error -y -i "$dir/raw.mp4" -f lavfi -i anullsrc=r=44100:cl=stereo -c:v copy -c:a aac -shortest -movflags +faststart "$dir/out.mp4" \
              || { fail "adding the sound track failed"; continue; }; fi
            up=$(api -X POST -d '{}' "$APP_URL/api/agent/posts/$id/video" | jq -r '.upload_url // empty')
            [ -n "$up" ] || { fail "no upload slot from Zernio"; continue; }
            curl -sSf -X PUT -H 'content-type: video/mp4' --upload-file "$dir/out.mp4" "$up" > /dev/null || { fail "upload failed"; continue; }
            api -X POST -d '{"done": true}' "$APP_URL/api/agent/posts/$id/video" > /dev/null && echo "post $id: video ready"
          done
